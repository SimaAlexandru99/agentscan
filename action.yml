name: agentscan
description: Find broken agent configuration — hooks whose scripts are gone, MCP servers that cannot start, skills that disagree with their lockfile
author: Sima Alexandru

branding:
  icon: search
  color: purple

inputs:
  path:
    description: Directory to scan. Defaults to the repository root.
    required: false
    default: "."
  fail-on:
    description: >
      Severity that fails the job: never (default), warning, or error.
      `error` means something configured here does not work; `warning` means the
      config and the filesystem disagree.
    required: false
    default: "error"
  fail-under:
    description: Fail when the 0-100 score drops below this floor. Empty to skip.
    required: false
    default: ""
  output:
    description: human (default), json, or prompt — a paste-ready handoff for a fixing agent.
    required: false
    default: "human"
  global:
    description: Also scan ~/.claude/skills and ~/.codex/skills. Rarely wanted in CI.
    required: false
    default: "false"
  bun-version:
    description: Bun version to install for the Action's source runtime. The published dist/cli.js bundle also runs on Node 20.11+.
    required: false
    default: "latest"

outputs:
  exit-code:
    description: 0 when nothing at or above `fail-on` was found, 1 when something was.
    value: ${{ steps.scan.outputs.exit-code }}
  report:
    description: The report as printed, in whichever format `output` selected.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      env:
        AGENTSCAN_BUN_VERSION: ${{ inputs.bun-version }}
      with:
        bun-version: ${{ env.AGENTSCAN_BUN_VERSION }}

    # Dependencies for the action's own checkout, not the caller's project.
    # `bunx agentscan` would fetch from npm, which pins the action to whatever
    # is published rather than to the ref the caller asked for — and returns 404
    # while the package is unpublished.
    - shell: bash
      run: bun install --frozen-lockfile --production
      working-directory: ${{ github.action_path }}

    - id: scan
      shell: bash
      # The report goes to the log and to an output. `set +e` because a non-zero
      # exit is the documented signal, not a failure to run — the step decides
      # what to do with it after capturing the report.
      env:
        AGENTSCAN_PATH: ${{ inputs.path }}
        AGENTSCAN_FAIL_ON: ${{ inputs.fail-on }}
        AGENTSCAN_FAIL_UNDER: ${{ inputs.fail-under }}
        AGENTSCAN_OUTPUT: ${{ inputs.output }}
        AGENTSCAN_GLOBAL: ${{ inputs.global }}
        AGENTSCAN_ACTION_PATH: ${{ github.action_path }}
      run: |
        set +e
        case "$AGENTSCAN_FAIL_ON" in
          never|warning|error) ;;
          *)
            printf '%s\n' 'Invalid fail-on value (use never|warning|error)' >&2
            exit 2
            ;;
        esac
        case "$AGENTSCAN_OUTPUT" in
          human|json|prompt) ;;
          *)
            printf '%s\n' 'Invalid output value (use human|json|prompt)' >&2
            exit 2
            ;;
        esac
        case "$AGENTSCAN_GLOBAL" in
          true|false) ;;
          *)
            printf '%s\n' 'Invalid global value (use true|false)' >&2
            exit 2
            ;;
        esac
        if [ -n "$AGENTSCAN_FAIL_UNDER" ]; then
          if ! [[ "$AGENTSCAN_FAIL_UNDER" =~ ^[0-9]{1,3}$ ]] ||
            (( 10#$AGENTSCAN_FAIL_UNDER > 100 )); then
            printf '%s\n' 'Invalid fail-under value (use 0-100)' >&2
            exit 2
          fi
        fi

        args=(check "$AGENTSCAN_PATH" --fail-on "$AGENTSCAN_FAIL_ON" --output "$AGENTSCAN_OUTPUT")
        if [ -n "$AGENTSCAN_FAIL_UNDER" ]; then
          args+=(--fail-under "$AGENTSCAN_FAIL_UNDER")
        fi
        if [ "$AGENTSCAN_GLOBAL" = "true" ]; then
          args+=(--global)
        fi
        report=$(bun "$AGENTSCAN_ACTION_PATH/src/cli.ts" "${args[@]}")
        code=$?
        printf '%s\n' "$report"
        {
          echo "exit-code=$code"
          echo "report<<AGENTSCAN_EOF"
          printf '%s\n' "$report"
          echo "AGENTSCAN_EOF"
        } >> "$GITHUB_OUTPUT"
        exit $code
