name: Spec drift

on:
  schedule:
    - cron: "0 9 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: Bun 1.4 rewrote the runtime from Zig to Rust
          # and CI would have taken it silently. 1.4.0 is the version every gate
          # in this repo was last verified on. Bump deliberately, after running
          # typecheck, the suite, the build and spec:check against the new one.
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Networked by design: keep this out of the deterministic PR gate.
      - run: bun run spec:check
