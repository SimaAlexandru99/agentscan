name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      # Dogfood: this repo has a skill and a lockfile, so a clean report here is
      # a real signal rather than a vacuous one.
      - run: bun run src/cli.ts check .
