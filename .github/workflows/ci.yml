name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: Bun 1.4 rewrote the runtime from Zig to Rust
          # and CI would have taken it silently. 1.4.0 is the version every gate
          # in this repo was last verified on. Bump deliberately, after running
          # typecheck, the suite, the build and spec:check against the new one.
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Build before the suite because Plan 013's Node subprocess contract
      # exercises the published artifact.
      - run: bun run build

      - run: bun test

      - name: Smoke test bundled CLI
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          const result = spawnSync(
            process.execPath,
            ["dist/cli.js", "check", "tests/fixtures/clean-repo", "--json"],
            { encoding: "utf8" },
          );
          if (result.status !== 0) {
            process.stderr.write(result.stderr);
            process.exit(result.status ?? 1);
          }
          const report = JSON.parse(result.stdout);
          if (report.findings.length !== 0) {
            throw new Error(`clean fixture had ${report.findings.length} findings`);
          }
          NODE

      # Dogfood: this repo has a skill and a lockfile, so a clean report here is
      # a real signal rather than a vacuous one.
      - run: bun run src/cli.ts check .
