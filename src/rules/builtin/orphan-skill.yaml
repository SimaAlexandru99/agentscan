id: skill.orphan
description: Skill not mapped to a dependency and not named in policy (info; collapsed in default text)
when:
  perSkill:
    orphan: true
then:
  action: warn
  severity: info
  subject: "skill:{{matchedSkill}}"
  message: "Unmapped skill — decision noise, not a runtime bug"
  reason: "No installed dependency matches skillscan's dep→skill map, and the skill id is not mentioned in AGENTS.md/CLAUDE.md. Large skill inventories (research sweet spot ~8–12) make agents pick worse. Default report collapses these into one ORPHAN line; this detail is for --verbose/JSON."
  suggest: "Keep if intentional (ignoreSkills or mention id in AGENTS.md). Prune only packs you do not use: rm -rf {{matchedSkillPath}}"
