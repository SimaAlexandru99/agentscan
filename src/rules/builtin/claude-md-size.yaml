id: budget.claude-md
description: CLAUDE.md longer than recommended policy size (>200 lines)
when:
  policyLines:
    file: CLAUDE.md
    gt: 200
    thresholdKey: claudeMdLines
then:
  action: warn
  severity: info
  subject: "budget:CLAUDE.md"
  message: "CLAUDE.md is long ({{count}} lines > {{threshold}})"
  reason: "Guidance keeps CLAUDE.md under ~200 lines. Long always-on instructions compete with task context."
  suggest: "Trim or link out; or set thresholds.claudeMdLines in .skillscanrc.json"
