id: budget.claude-md
description: CLAUDE.md longer than the instruction budget a model reliably follows (>200 lines)
when:
  policyLines:
    file: CLAUDE.md
    gt: 200
    thresholdKey: claudeMdLines
then:
  action: warn
  severity: info
  message: "CLAUDE.md is long ({{count}} lines > {{threshold}})"
  reason: "Frontier models reliably follow roughly 150-200 instructions, and Claude Code's own system prompt already spends about 50 of them. Past that the file is skim-read rather than obeyed. Imports do not help: imported files load at launch too, so splitting organises the text without reducing what competes for attention."
  suggest: "Keep only what is true every session; move the rest into a skill, which loads on demand. Or set thresholds.claudeMdLines in .agentscanrc.json"
