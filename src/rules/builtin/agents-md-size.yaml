id: budget.agents-md
description: AGENTS.md longer than the point where added lines stop helping (>150 lines)
when:
  policyLines:
    file: AGENTS.md
    gt: 150
    thresholdKey: agentsMdLines
then:
  action: warn
  severity: info
  message: "AGENTS.md is long ({{count}} lines > {{threshold}})"
  reason: "Measured across 2,500+ repositories: past ~150 lines additional content delivers diminishing returns and raises inference cost 20-23% without improving agent performance. Unnecessary requirements actively hurt, by broadening exploration. A lean file is 40-60 lines of commands and boundaries."
  suggest: "Delete rather than reorganise — keep only what an agent cannot infer from the code. Or set thresholds.agentsMdLines in .agentscanrc.json"
