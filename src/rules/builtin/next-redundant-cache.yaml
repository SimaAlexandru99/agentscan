id: next.redundant-cache-components-skill
description: Next 16+ ships cache-components docs; local skill is often duplicate/stale
when:
  all:
    - dep: next
      gte: "16.0.0"
    - skillMatches:
        - next-cache-components
        - next-cache
then:
  action: delete
  severity: warning
  subject: "skill:{{matchedSkill}}"
  message: "Redundant with Next 16+ framework docs (not a security issue)"
  reason: "This project has next >= 16.0.0, which documents Cache Components under node_modules/next. A separate agent skill often drifts from that version and adds decision noise when picking skills. Safe to remove unless the skill has team-specific notes beyond upstream docs."
  suggest: "rm -rf {{matchedSkillPath}}   # or add to ignoreSkills if you keep a custom fork"
